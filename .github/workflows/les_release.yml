name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Sign, notarize, and publish
    runs-on: macos-14
    environment: release
    env:
      APP_PATH: Live Enhancement Suite Custom.app
      DMG_PATH: release/LiveEnhancementSuiteCustom.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '15.4'

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?MACOS_CERTIFICATE_P12_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"
          : "${KEYCHAIN_PASSWORD:?MACOS_KEYCHAIN_PASSWORD is required}"

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/les-release.keychain-db"
          printf '%s' "${CERTIFICATE_P12_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

      - name: Build signed release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          LOG_NAME="build_$(date +%s).log"
          xcodebuild \
            -workspace Hammerspoon.xcworkspace \
            -scheme Release \
            -configuration Release \
            -destination platform=macOS \
            GCC_INSTRUMENT_PROGRAM_FLOW_ARCS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            build | tee "${LOG_NAME}"

      - name: Collect and verify signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUILT_APP=$(find "${HOME}/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release/Live Enhancement Suite Custom.app' -print -quit)
          : "${BUILT_APP:?Signed application was not produced}"
          ditto "${BUILT_APP}" "${APP_PATH}"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          SIGNATURE_INFO=$(codesign --display --verbose=4 "${APP_PATH}" 2>&1)
          grep -q '^Authority=Developer ID Application:' <<<"${SIGNATURE_INFO}"
          grep -q "^TeamIdentifier=${APPLE_TEAM_ID}$" <<<"${SIGNATURE_INFO}"
          if grep -q '^Signature=adhoc$' <<<"${SIGNATURE_INFO}"; then
            echo 'Refusing to publish an ad-hoc signed application' >&2
            exit 1
          fi

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${APPLE_APP_PASSWORD:?APPLE_APP_PASSWORD is required}"

          ditto -c -k --keepParent "${APP_PATH}" "${RUNNER_TEMP}/les-app.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/les-app.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"
          spctl --assess --type execute --verbose=4 "${APP_PATH}"

      - name: Create, sign, and notarize disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release
          hdiutil create -volname 'LES Custom' -srcfolder "${APP_PATH}" -ov -format UDZO "${DMG_PATH}"
          codesign --sign 'Developer ID Application' --timestamp "${DMG_PATH}"
          codesign --verify --strict --verbose=2 "${DMG_PATH}"
          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${DMG_PATH}"
          shasum -a 256 "${DMG_PATH}" > "${DMG_PATH}.sha256sum"

      - name: Store verified assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-assets
          path: |
            release/LiveEnhancementSuiteCustom.dmg
            release/LiveEnhancementSuiteCustom.dmg.sha256sum
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/les-release.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/les-app.zip"

  publish:
    name: Publish verified assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required only here to create and update the tagged release.
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-assets
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            release/LiveEnhancementSuiteCustom.dmg \
            release/LiveEnhancementSuiteCustom.dmg.sha256sum \
            --clobber
